id: IN-WKBCH-STRUCT-INSTRCN

name: In-Workbench Structure Instruction

purpose: >
  Define the canonical semantic structure, containment boundaries,
  and shared structural vocabulary of an RXI Course Workbench unit.

principles:
  - >
    This instruction defines structure only.
    It does not generate course-specific instructional content.

  - >
    Semantic keys and containment paths defined here must be preserved
    across downstream Workbench structures, schemas, runtime objects,
    and semantic DOM mappings.

  - >
    A Sub-item is recursively represented as an Item within sub_items.
    Do not introduce separate sub-item types.

structure:

  workbench_page:

    page_header:
      main_title: null
      page_index: null

    workbench:

      slide_panel:
        slide_title: null

        items:
          - item_id: null
            content: null
            explainability: null

            sub_items:
              - recursive: item

        rxi_lab_logo: null

      review_panel:

        provenance_block:
          title: "Provenance"

          sources:
            - provenance_name: null
              authority: null
              short_description: null
              url: null

              targets:
                - item_id: null
                  support_role: null

        lecturing_guide_block:
          title: "Lecturing Guide"

          teaching_intent: null
          explanation: null
          emphasis: null
          learner_check: null
          caution: null

        artifacts_block:
          title: "Artifacts"

          artifacts:
            - artifact_name: null
              artifact_type: null
              short_description: null
              external_link: null

              targets:
                - item_id: null
                  support_role: null

    page_branding_runtime_metadata:
      optional: true