_rxi_210_boundary_:
  id: RXI-210-BOUNDARY
  course_id: RXI-210
  title: Fundamentals of Computing and Artificial Intelligence

  binding:
    bsd_index: 0
    bsd_id: BSD-COMP-AI

  academic_level: 2
  learning_depth: 1
  course_role: fundamental

  course_intent: >
    Establish a coherent academic foundation in Computing and Artificial
    Intelligence through conceptual understanding, computational reasoning,
    guided inquiry, and foundational technical practice.

  depth_boundary: >
    Prioritize foundational concepts, relationships, and transferable
    reasoning over disciplinary completeness or advanced specialization.

  constraints:
    - Prefer foundational and dependency-bearing knowledge over specialized topics.
    - Do not attempt exhaustive coverage of BSD-bound Fields or Stems.
    - Do not reproduce an undergraduate curriculum at reduced scale.
    - Do not reduce the course to programming, software tutorials, or AI tool demonstrations.
    - Preserve authentic academic substance at an appropriate foundational depth.